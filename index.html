<form id="assessmentForm">
  <div class="form-group">
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" required placeholder="e.g. Sarah Jenkins">
  </div>
  <div class="form-group">
    <label for="email">Work Email</label>
    <input type="email" id="email" required placeholder="sarah@apexurban.com">
  </div>
  <div class="form-group">
    <label for="company">Company / Entity</label>
    <input type="text" id="company" required placeholder="e.g. Apex Urban Developments">
  </div>
  <div class="form-group">
    <label for="role">Role / Title</label>
    <input type="text" id="role" placeholder="e.g. Founder, CEO, Development Director">
  </div>
  <button type="submit">Submit for Assessment</button>
</form>
